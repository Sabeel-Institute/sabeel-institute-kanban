apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Sentry source-map upload, so an Android crash reports function names rather
 * than minified frames — the same thing `@sentry/react-native/expo` does for
 * iOS, reached a different way for a deliberate reason.
 *
 * A config plugin runs at PREBUILD, and this folder is committed and hand-edited
 * — `npx expo prebuild` is always scoped to `--platform ios` here, so a plugin
 * can never reach Android. Wiring it in Gradle is not a workaround; it is the
 * only mechanism that applies to a bare-workflow native folder.
 *
 * GATED ON THE ENVIRONMENT, and that gate is load-bearing. Without
 * SENTRY_AUTH_TOKEN this block does nothing at all, so CI, a fresh clone and any
 * machine without the token build exactly what they built before. The release
 * path must not acquire a dependency on a network service that can fail.
 *
 * THE SAME THREE VARIABLES SERVE BOTH PLATFORMS — SENTRY_ORG, SENTRY_PROJECT and
 * SENTRY_AUTH_TOKEN — because `sentry-cli` reads them from the environment and
 * the Expo plugin is registered bare so that it falls back to them too. One set
 * of names, one place to set them, and nothing project-identifying committed to
 * a public repo. Deliberately NOT the sibling time-tracker's `sentry.properties`
 * file: that would be a second source for the same three values, and the two
 * would drift. See docs/SECRETS.md.
 *
 * Android and iOS report to ONE Sentry project, since both read
 * EXPO_PUBLIC_SENTRY_DSN_NATIVE — so SENTRY_PROJECT is a single value and parity
 * is structural rather than something to keep in step.
 */
if (System.getenv("SENTRY_AUTH_TOKEN")) {
    apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute(null, rootDir).text.trim(), "../sentry.gradle")
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * Single source of version truth: app.json.
 *
 * versionName / versionCode used to be the Gradle scaffold defaults ("0.1.0", 1)
 * and were never bumped, so every release shipped from here reported to Sentry
 * as com.sabeelinstitute.kanban@0.1.0+1 — seven builds indistinguishable, and
 * release-health tracking dead. Deriving both from app.json means a version bump
 * happens in exactly one place and cannot silently desync again.
 *
 * versionCode is computed from the semver so it increases monotonically:
 * major*1000000 + minor*1000 + patch (0.1.7 -> 1007).
 *
 * The multipliers used to be 10000/100, which gave each component only two
 * digits — and 0.1.100 and 0.2.0 both computed to 200. A COLLISION, not merely a
 * quirk: Android refuses an install whose versionCode is not greater than the
 * installed one, and Play rejects a duplicate outright, so the release after
 * 0.1.99 would simply have failed to go out. At the rate patches were landing
 * that was weeks away, not years. Widening is safe because it only ever produces
 * LARGER codes than the old scheme (0.1.33: 133 -> 1033), so monotonicity across
 * the change is preserved.
 *
 * Room for 999 minor and 999 patch, and major up to ~2147 before Android's
 * signed-32-bit ceiling (2100000000). Anything out of range STOPS the build
 * rather than silently colliding again.
 *
 * The version itself must stay App-Store-legal (three integers, no suffix) —
 * scripts/check-version.mjs enforces that, and it is why nothing here strips a
 * pre-release suffix any more: there must not be one to strip.
 */
def expoVersion = new groovy.json.JsonSlurper()
    .parse(file("$projectRoot/app.json")).expo.version
// No leading zeros: `2026.07.01` passes a naive \d+ check and is even legal to
// Apple, but 07 and 7 are the same number — so the scheme silently stops
// increasing, and the arithmetic below reads 7 where a human reads 07.
def versionParts = expoVersion.tokenize('.')
if (versionParts.size() != 3 || !expoVersion.matches(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/)) {
    throw new GradleException(
        "app.json version '${expoVersion}' must be exactly three integers (X.Y.Z), " +
        "no leading zeros — see scripts/check-version.mjs.")
}
def (vMajor, vMinor, vPatch) = versionParts.collect { it.toInteger() }
if (vMinor > 999 || vPatch > 999 || vMajor > 2147) {
    throw new GradleException(
        "app.json version '${expoVersion}' overflows the versionCode scheme " +
        "(minor/patch max 999, major max 2147).")
}
def computedVersionCode = vMajor * 1000000 + vMinor * 1000 + vPatch

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.sabeelinstitute.kanban'
    defaultConfig {
        applicationId 'com.sabeelinstitute.kanban'
        // Android 13. Set HERE rather than taken from Expo's default (24),
        // because it is a product decision, not a scaffold detail: 13 is where
        // the system photo picker arrives, so picking a photo needs no storage
        // permission and the whole legacy camera-roll path disappears. Android
        // 12 and older are unsupported (2026-07-27).
        minSdkVersion 33
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName expoVersion

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    /**
     * Release signing. The keystore and its passwords live OUTSIDE the repo, in
     * a gitignored `app/android/keystore.properties`:
     *
     *     storeFile=/absolute/path/to/sabeel-kanban-upload.jks
     *     storePassword=...
     *     keyAlias=upload
     *     keyPassword=...
     *
     * Never in this file, and never in git — this repo is public. The keystore
     * and this file exist already: restore both from the vault, never generate
     * a new key (docs/SECRETS.md).
     *
     * When the file is absent the release build falls back to the DEBUG key so
     * local builds still work, but it says so loudly, and scripts/publish-apk.sh
     * refuses to publish the result. A debug-signed release is exactly the kind
     * of failure that imitates success: the APK installs and runs perfectly, and
     * the only symptom is that anyone holding this public repo can sign an
     * update Android will accept as this app.
     */
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    /**
     * Per-ABI APKs instead of one universal binary.
     *
     * A universal APK carries native libraries (Hermes, RN core, Google Play
     * services shims) for EVERY architecture, so a phone downloads three copies
     * it can never execute. Splitting takes the download from ~82 MB to roughly a
     * third of that for the arm64 build every modern phone actually uses.
     *
     * `universalApk true` keeps the everything-included artifact as a fallback
     * for anyone unsure which to grab.
     *
     * SPLITS ARE FOR THE APK CHANNEL ONLY, and are turned off automatically for
     * `bundleRelease`. An App Bundle already carries every ABI and Play does the
     * splitting itself, so the two cannot both be on: Gradle fails with
     * "Multiple shrunk-resources files found ... Please disable building
     * multiple APKs when building an Android app bundle."
     *
     * This also retires the warning that used to live here about per-split
     * versionCode offsets. Those are only needed when uploading several APKs to
     * Play; a bundle is one artifact with one versionCode and Play derives the
     * splits, so nothing extra is required.
     *
     * Detected from the task name rather than left to a flag someone must
     * remember, with -PabiSplits=true|false as an override.
     */
    def isBundleBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
    def abiSplits = (findProperty('abiSplits') ?: (!isBundleBuild).toString()).toBoolean()
    splits {
        abi {
            enable abiSplits
            reset()
            // x86_64 is kept because that is what the Android emulator runs, and
            // an unverifiable build is not worth the bytes it saves.
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            /**
             * A separate package, so a dev build and the Play build coexist.
             *
             * Android keys an install on applicationId, so without this the two
             * collide: same package, different signature, and installing either
             * one simply fails until the other is uninstalled. Suffixing debug
             * makes them independent apps that can sit side by side.
             *
             * The cost is that `com.sabeelinstitute.kanban.debug` is a DIFFERENT
             * app to Firebase and needs its own registration with the debug
             * SHA-1, or the google-services plugin fails the build outright with
             * "No matching client found for package name".
             *
             * `expo run:android` does not know about this: it reads the
             * applicationId with a regex over the `applicationId` line alone and
             * would install the .debug APK, then try to launch the unsuffixed
             * package. Hence `--app-id` in the dev:android script.
             */
            applicationIdSuffix '.debug'
        }
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('*** RELEASE BUILD IS DEBUG-SIGNED: app/android/keystore.properties ' +
                    'is missing. Fine locally; NOT publishable. Restore it from the vault: docs/SECRETS.md. ***')
                signingConfig signingConfigs.debug
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: 'com.google.gms.google-services'
