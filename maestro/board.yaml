# The board: sign-in, the column pager and its swipe, a card, the native
# rich-text editor and a mention through it, the tabs and long-press
# selection. Seeded by scripts/seed-emulators.mjs; run by `npx sabeel-ci
# native-e2e`. A step that moves the app to another screen checks that it did
# (ci-tools/tap-until.yaml): a busy CI simulator drops taps that land before a
# screen takes them, and a step is taken again only while its screen shows.
appId: ${APP_ID}
name: Board, card, rich text and gestures
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
# A card's texts are one accessibility label on iOS ("Fundraising 2026, 14
# cards · 3 members"), and Maestro matches the whole label, so names here are
# prefixes. On a busy CI Mac the debug app can also reload once after its first
# screen (Metro served the bundle twice on Kanban #30), taking a sign-in tap
# with it.
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "faisal"
      EXPECT: "Fundraising 2026[\\s\\S]*"
      SECONDS: 60
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- takeScreenshot: 01-boards

# The column pager: the arrow and the swipe.
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Fundraising 2026[\\s\\S]*"
      EXPECT: "To Do"
      SECONDS: 60
- tapOn: "Next column"
- assertVisible: "In Progress"
- swipe:
    direction: LEFT
- assertVisible: "Done"
- takeScreenshot: 02-board-swiped
- tapOn: "Previous column"
- tapOn: "Previous column"
- assertVisible: "To Do"

# A card, and the native editor: type, bold, save.
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Draft the donor letter[\\s\\S]*"
      EXPECT: "Attachments \\(1\\)"
      SECONDS: 30
- tapOn: "Edit description"
- tapOn:
    below: "Bold"
- inputText: "Native flow line"
- tapOn: "Bold"
- inputText: " bold"
# Android's keyboard covers Save. iOS leaves it in view, and Maestro cannot
# dismiss the native editor's keyboard there.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    visible: "[\\s\\S]*Native flow line bold[\\s\\S]*"
    timeout: 15000
- takeScreenshot: 03-card-description

# A mention, through the native editor's own output. The editor writes a
# picked mention as <mention text="sara" indicator="@">, a shape it does not
# document, and the HTML seam turns that back into "@sara"; the comment names
# Sara as mentioned only if both still hold (app/src/mentionSeam.test.ts).
- scrollUntilVisible:
    element: "Add a comment[\\s\\S]*"
- tapOn: "Add a comment[\\s\\S]*"
- inputText: "Over to @Sa"
- tapOn: "Mention Sara"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: "Comment"
- tapOn: "Comment"
- extendedWaitUntil:
    visible: "mentioned Sara"
    timeout: 15000
- assertVisible: "[\\s\\S]*@sara[\\s\\S]*"
- takeScreenshot: 04-card-mention
- scrollUntilVisible:
    element: "Back"
    direction: UP
- tapOn: "Back"

# Selecting a whole comment. A phone draws a comment as ONE text view, because
# Android selection cannot cross views: one element holding the first and last
# lines is what makes Select all mean all of it (seeded through the web
# composer by scripts/seed-emulators.mjs), and it is the check, on both
# platforms. Select all is exercised on Android, where its menu item has that
# name; nothing on screen says how much it took.
- extendedWaitUntil:
    visible: "Tap a card to open it\\.[\\s\\S]*"
    timeout: 15000
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Book the venue[\\s\\S]*"
      EXPECT: "Description"
      SECONDS: 30
- scrollUntilVisible:
    element: "Two things before we book:[\\s\\S]*I can call them on Thursday\\."
- runFlow:
    when:
      platform: Android
    commands:
      - longPressOn: "Two things before we book:[\\s\\S]*"
      - tapOn: "Select all"
      - takeScreenshot: 05-select-all
      # Clears the selection without opening anything: a heading.
      - tapOn: "Comments \\(\\d+\\)"
- scrollUntilVisible:
    element: "Back"
    direction: UP
- tapOn: "Back"

# Long-press starts a selection. The board must be back and settled first: a
# long-press that lands while it is still animating in starts nothing (the
# iPhone simulator on a busy CI Mac, Kanban #29), so a missed one gets one
# more try; a press that did select shows "1 selected" within the wait.
- extendedWaitUntil:
    visible: "Tap a card to open it\\.[\\s\\S]*"
    timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - longPressOn: "Book the venue[\\s\\S]*"
      - extendedWaitUntil:
          visible: "1 selected[\\s\\S]*"
          timeout: 10000
- takeScreenshot: 06-selection
- tapOn: "Back"

# Copying the board: a long-press on its row in the boards list opens the
# copy sheet, its name field typed into, and the copy opens as a board of its
# own. The field starts as the board's name, so typing adds to it.
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Boards"
      EXPECT: "New board"
      SECONDS: 30
- retry:
    maxRetries: 2
    commands:
      - longPressOn: "Fundraising 2026[\\s\\S]*"
      - extendedWaitUntil:
          visible: "Name of the copy"
          timeout: 10000
- inputText: " copy"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- takeScreenshot: 07-copy-board
- tapOn: "Copy"
# The board screen first: the copy's name is in the sheet's field too, so
# waiting on it would pass before the copy was made. The callable writes a
# board and fourteen cards, which a busy CI Mac took over 15 s to show.
- extendedWaitUntil:
    visible: "Tap a card to open it\\.[\\s\\S]*"
    timeout: 60000
- assertVisible: "Fundraising 2026 copy[\\s\\S]*"
# Back to the boards list, where the tabs are: a board has none of its own.
# The app's own Back, as everywhere in this flow; ci-tools' back.yaml is for a
# native-stack header, which this app does not have.
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Back"
      EXPECT: "New board"
      SECONDS: 30

# Every tab answers, each with something only its own screen shows.
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "My Work"
      EXPECT: "Nothing is assigned to you right now\\."
      SECONDS: 30
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Search"
      EXPECT: "Search cards across your boards"
      SECONDS: 30
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "Alerts[\\s\\S]*"
      EXPECT: "Mark all read"
      SECONDS: 30
- runFlow:
    file: ci-tools/tap-until.yaml
    env:
      TARGET: "More"
      EXPECT: "Report a problem"
      SECONDS: 30
- takeScreenshot: 08-more

# Help: a film opens in the platform's own player (expo-video), which is a
# native module of its own. The player's frame is what is checked, so a
# player missing from the build fails here; the emulator need not reach the
# films' site.
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Inside a board"
    timeout: 15000
- tapOn: "Inside a board"
- extendedWaitUntil:
    visible:
      id: "help-film"
    timeout: 20000
- takeScreenshot: 09-help-film
