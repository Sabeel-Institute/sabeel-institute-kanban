# The board on Android: sign-in, the column pager and its swipe, a card, the
# native rich-text editor and a mention through it, the tabs and long-press
# selection. Seeded by scripts/seed-emulators.mjs; run by `npx sabeel-ci
# native-e2e`.
appId: ${APP_ID}
name: Board, card, rich text and gestures
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Dev sign-in \\(emulator only\\)"
    timeout: 180000
# A card's texts are one accessibility label on iOS ("Fundraising 2026, 14
# cards · 3 members"), and Maestro matches the whole label, so names here are
# prefixes. On a busy CI Mac the debug app can reload once after its first
# screen (Metro served the bundle twice on Kanban #30), taking a sign-in tap
# with it; the tap gets one more try.
- retry:
    maxRetries: 1
    commands:
      - extendedWaitUntil:
          visible: "Dev sign-in \\(emulator only\\)"
          timeout: 60000
      - tapOn: "faisal"
      - extendedWaitUntil:
          visible: "Fundraising 2026[\\s\\S]*"
          timeout: 60000
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- takeScreenshot: 01-boards

# The column pager: the arrow and the swipe.
- tapOn: "Fundraising 2026[\\s\\S]*"
- extendedWaitUntil:
    visible: "To Do"
    timeout: 30000
- tapOn: "Next column"
- assertVisible: "In Progress"
- swipe:
    direction: LEFT
- assertVisible: "Done"
- takeScreenshot: 02-board-swiped
- tapOn: "Previous column"
- tapOn: "Previous column"
- assertVisible: "To Do"

# A card, and the native editor: type, bold, save.
- tapOn: "Draft the donor letter[\\s\\S]*"
- assertVisible: "Attachments \\(1\\)"
- tapOn: "Edit description"
- tapOn:
    below: "Bold"
- inputText: "Native flow line"
- tapOn: "Bold"
- inputText: " bold"
# Android's keyboard covers Save. iOS leaves it in view, and Maestro cannot
# dismiss the native editor's keyboard there.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    visible: "[\\s\\S]*Native flow line bold[\\s\\S]*"
    timeout: 15000
- takeScreenshot: 03-card-description

# A mention, through the native editor's own output. The editor writes a
# picked mention as <mention text="sara" indicator="@">, a shape it does not
# document, and the HTML seam turns that back into "@sara"; the comment names
# Sara as mentioned only if both still hold (app/src/mentionSeam.test.ts).
- scrollUntilVisible:
    element: "Add a comment[\\s\\S]*"
- tapOn: "Add a comment[\\s\\S]*"
- inputText: "Over to @Sa"
- tapOn: "Mention Sara"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: "Comment"
- tapOn: "Comment"
- extendedWaitUntil:
    visible: "mentioned Sara"
    timeout: 15000
- assertVisible: "[\\s\\S]*@sara[\\s\\S]*"
- takeScreenshot: 04-card-mention
- scrollUntilVisible:
    element: "Back"
    direction: UP
- tapOn: "Back"

# Long-press starts a selection. The board must be back and settled first: a
# long-press that lands while it is still animating in starts nothing (the
# iPhone simulator on a busy CI Mac, Kanban #29), so a missed one gets one
# more try; a press that did select shows "1 selected" within the wait.
- extendedWaitUntil:
    visible: "Tap a card to open it\\.[\\s\\S]*"
    timeout: 15000
- retry:
    maxRetries: 1
    commands:
      - longPressOn: "Book the venue[\\s\\S]*"
      - extendedWaitUntil:
          visible: "1 selected[\\s\\S]*"
          timeout: 10000
- takeScreenshot: 05-selection
- tapOn: "Back"

# Every tab answers, each with something only its own screen shows.
- tapOn: "My Work"
- assertVisible: "Nothing is assigned to you right now\\."
- tapOn: "Search"
- assertVisible: "Search cards across your boards"
- tapOn: "Alerts[\\s\\S]*"
- assertVisible: "Mark all read"
- tapOn: "More"
- assertVisible: "Report a problem"
- takeScreenshot: 06-more
