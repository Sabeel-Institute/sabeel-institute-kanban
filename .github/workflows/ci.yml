name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-validation:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color

  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Web export
        run: npm run web:export -w @sabeel/app

  integration:
    if: github.event.pull_request.draft != true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      - name: Emulator integration tests
        run: npm run test:emulator

  browser:
    if: github.event.pull_request.draft != true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite:
          - scripts/attachments-e2e.mjs
          - scripts/web-e2e.mjs
          - scripts/stats-e2e.mjs
          - scripts/screens-e2e.mjs
          - scripts/richtext-e2e.mjs
          - scripts/typing-perf-e2e.mjs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        env:
          E2E_SUITE: ${{ matrix.suite }}
        run: bash scripts/e2e.sh "$E2E_SUITE"
      - name: Screens report, compared with main
        if: always() && matrix.suite == 'scripts/screens-e2e.mjs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/screens-report.mjs shots/screens --baseline-from-main --out "$RUNNER_TEMP/screens-report"
      - name: Keep the screens report
        if: always() && matrix.suite == 'scripts/screens-e2e.mjs'
        uses: actions/upload-artifact@v7
        with:
          name: screens-report
          path: ${{ runner.temp }}/screens-report
          retention-days: 30
      - name: Screens and logs from a failed suite
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ strategy.job-index }}
          path: shots/
          retention-days: 7

  migration:
    if: github.event.pull_request.draft != true
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@^15
      - name: Migration scripts end-to-end
        run: |
          firebase emulators:exec --project demo-sabeel-kanban \
            --only firestore,auth "node scripts/migration-e2e.mjs"

  build-test:
    if: always() && github.event.pull_request.draft != true
    needs: [workflow-validation, quality, integration, browser, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.values(JSON.parse(process.env.JOB_RESULTS)); if (!jobs.length || jobs.some(job => job.result !== "success")) process.exit(1);'
